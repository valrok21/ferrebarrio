[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests*", "config/wsgi.py", "manage.py", "conftest.py"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"**/tests*.py" = ["S105", "S106"]
"cuentas/management/commands/poblar_demo.py" = ["S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
