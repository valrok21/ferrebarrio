<div class="mx-auto w-full max-w-md">
  <div class="tarjeta sm:p-6">
    <h1 class="pb-4 text-xl font-bold tracking-tight">{{ titulo }}</h1>
    <form method="post" class="fb-form" novalidate>{% csrf_token %}
      {{ form.non_field_errors }}
      {% for campo in form %}<div>{% if campo.field.widget.input_type == "checkbox" %}{{ campo }} {{ campo.label_tag }}{% else %}{{ campo.label_tag }} {{ campo }}{% endif %}{{ campo.errors }}</div>{% endfor %}
      <button class="boton boton-{{ boton_clase|default:'primario' }} mt-1 w-full">{{ boton }}</button>
    </form>
  </div>
</div>
